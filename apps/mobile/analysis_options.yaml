include: package:flutter_lints/flutter.yaml

# Crowdbeats V2 — Additional lint rules beyond the flutter_lints baseline
# See: https://dart.dev/tools/linter-rules

linter:
  rules:
    # Style
    - always_declare_return_types
    - avoid_print
    - avoid_unnecessary_containers
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_final_fields
    - prefer_final_locals
    - sized_box_for_whitespace
    - sort_child_properties_last
    - use_full_hex_values_for_flutter_colors
    - use_key_in_widget_constructors

    # Safety
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - literal_only_boolean_expressions
    - no_logic_in_create_state
    - unawaited_futures

    # Architecture invariants
    # Money: no floating-point arithmetic — enforced by type system (amountCents: int)
    - prefer_int_literals

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore  # common with code generation packages
    deprecated_member_use: ignore
    prefer_const_constructors: ignore
    prefer_const_constructors_in_immutables: ignore
    prefer_final_fields: ignore
    prefer_final_locals: ignore
    prefer_interpolation_to_compose_strings: ignore
    prefer_int_literals: ignore
    unnecessary_underscores: ignore
    unused_import: ignore
    unused_field: ignore
    unnecessary_non_null_assertion: ignore
    inference_failure_on_instance_creation: ignore
    inference_failure_on_function_invocation: ignore
    strict_raw_type: ignore
    sized_box_for_whitespace: ignore
    avoid_unnecessary_containers: ignore
    sort_child_properties_last: ignore
    use_null_aware_elements: ignore
    unawaited_futures: ignore
    use_build_context_synchronously: ignore
    unnecessary_const: ignore
    unnecessary_brace_in_string_interps: ignore
    constant_identifier_names: ignore
    unnecessary_overrides: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
